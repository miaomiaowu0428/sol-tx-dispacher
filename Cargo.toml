[package]
name = "sol-tx-dispacher"
version = "0.1.0"
edition = "2024"

[features]
default = [
    "astralane",
    "astralane_quic",
    "everstake",
    "everstake_quic",
    "flash_block",
    "nodeone",
    "nodeone_quic",
    "blockrazor",
    "temporal",
    "helius",
    "zeroslot",
    "nextblock",
    "stellium",
    "jito",
    "landx",
    "harmonic",
    "syncro",
]
full = [
    "astralane",
    "astralane_quic",
    "everstake",
    "everstake_quic",
    "flash_block",
    "flash_block_quic",
    "nodeone",
    "nodeone_quic",
    "blockrazor",
    "temporal",
    "helius",
    "zeroslot",
    "nextblock",
    "stellium",
    "jito",
    "landx",
    "harmonic",
    "syncro",
]
astralane       = []
astralane_quic  = []
everstake       = []
everstake_quic  = []
flash_block     = []
# FlashBlock QUIC（FLQ1 v1：单向流 + 帧格式 + **无应用回执**）。
# 刻意**不进 default**：与 HTTP 共用同一个 TPS 限额，超限帧是**静默丢弃**的
# （没有任何错误/日志可观测）。确认账号 TPS 有余量后，再把它加进构建的 feature 列表。
flash_block_quic = []
nodeone         = []
# Node1 QUIC：UUID 认证 + 双向 stream（与 nodeone HTTP 同 key、同 tip 账户）
nodeone_quic    = []
blockrazor      = []
temporal        = []
# Helius Sender：Max 与 SWQOS-only 共用同一 key + 同一 feature，同开同关
helius          = []
zeroslot        = []
nextblock       = []
stellium        = []
jito            = []
# LandX：HTTP JSON-RPC SWQoS 通道（API key 放在 URL path 里，见 LANDX_API_KEY）
landx           = []
harmonic        = []
# P2P.org Syncro Sender：P2P.org Turbo 节点出块时追加的 SWQoS 通道（带 API key）
syncro          = []

[dependencies]
sol-slot-leader = { git = "https://github.com/miaomiaowu0428/sol-slot-leader.git", branch = "main" }
sol-tx-send     = { git = "https://github.com/miaomiaowu0428/sol-tx-sender.git", branch = "main" }
nonce_cache     = { git = "https://github.com/miaomiaowu0428/nonce_cache.git", branch = "main" }
grpc-client     = { git = "https://github.com/miaomiaowu0428/grpc-client.git", branch = "main" }
tokio           = { version = "1", features = ["full"] }
log             = "0.4"
anyhow          = "1"
ahash           = "0.8"
solana-sdk = "4.0.0"
solana-client = "4.2.2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
async-trait = "0.1"

[dev-dependencies]
const-accounts = { git = "https://github.com/miaomiaowu0428/const-accounts.git", branch = "main" }
async-trait = "0.1.89"
